name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    name: Validate Godot project (parse + import)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /opt/godot
          key: godot-4.3-stable-linux

      - name: Install Godot 4.3
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p /opt/godot
          curl -sSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d /opt/godot/
          mv /opt/godot/Godot_v4.3-stable_linux.x86_64 /opt/godot/godot
          chmod +x /opt/godot/godot

      - name: Import project (build .godot cache)
        run: /opt/godot/godot --headless --import

      - name: Re-import to verify clean parse
        run: /opt/godot/godot --headless --import 2>&1 | tee import.log
      - name: Fail on script errors
        run: |
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" import.log; then
            echo "Parse/compile errors found in Godot import output." >&2
            exit 1
          fi

  web-export:
    name: Build Web (PWA) export
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: /opt/godot
          key: godot-4.3-stable-linux

      - name: Ensure Godot present
        run: |
          set -euxo pipefail
          if [ ! -x /opt/godot/godot ]; then
            mkdir -p /opt/godot
            curl -sSL -o /tmp/godot.zip \
              https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
            unzip -o /tmp/godot.zip -d /opt/godot/
            mv /opt/godot/Godot_v4.3-stable_linux.x86_64 /opt/godot/godot
            chmod +x /opt/godot/godot
          fi

      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-4.3-stable-templates

      - name: Install Godot export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p ~/.local/share/godot/export_templates
          curl -sSL -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -o /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/4.3.stable

      - name: Import project
        run: /opt/godot/godot --headless --import

      - name: Build Web export
        run: |
          mkdir -p exports/web
          /opt/godot/godot --headless --export-release "Web" exports/web/index.html 2>&1 | tee export.log
          ls -la exports/web

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-pwa
          path: exports/web/
          if-no-files-found: error

  android-export:
    name: Build Android APK (debug-signed)
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: /opt/godot
          key: godot-4.3-stable-linux

      - name: Ensure Godot present
        run: |
          set -euxo pipefail
          if [ ! -x /opt/godot/godot ]; then
            mkdir -p /opt/godot
            curl -sSL -o /tmp/godot.zip \
              https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
            unzip -o /tmp/godot.zip -d /opt/godot/
            mv /opt/godot/Godot_v4.3-stable_linux.x86_64 /opt/godot/godot
            chmod +x /opt/godot/godot
          fi

      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-4.3-stable-templates

      - name: Install Godot export templates
        run: |
          set -euxo pipefail
          if [ ! -d ~/.local/share/godot/export_templates/4.3.stable ]; then
            mkdir -p ~/.local/share/godot/export_templates
            curl -sSL -o /tmp/templates.tpz \
              https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -o /tmp/templates.tpz -d /tmp/templates
            mv /tmp/templates/templates ~/.local/share/godot/export_templates/4.3.stable
          fi

      - name: Generate debug keystore
        run: |
          set -euxo pipefail
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$HOME/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999

      - name: Configure Godot editor settings for Android export
        run: |
          set -euxo pipefail
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          export/android/one_click_deploy_clear_previous_install = false
          EOF

      - name: Import project (build .godot cache)
        run: /opt/godot/godot --headless --import

      - name: Build Android APK (debug)
        run: |
          set -euxo pipefail
          mkdir -p exports/android
          /opt/godot/godot --headless --export-debug "Android" exports/android/veseliy-mogilshchik-debug.apk 2>&1 | tee export.log
          ls -la exports/android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: exports/android/*.apk
          if-no-files-found: error
